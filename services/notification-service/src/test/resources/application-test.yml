server:
  port: 0

spring:
  application:
    name: notification-service-test
  datasource:
    url: jdbc:h2:mem:notificationdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

notification:
  from-email: no-reply@aurastore.com
  smtp:
    enabled: false
